# Marks web/ as its own pnpm root, independent of the Expo app above it.
packages:
  - "."

# pnpm 11 requires every dependency with a install/build script to be
# explicitly allowed or denied; leaving one unanswered makes `pnpm install`
# exit non-zero, which would fail the Amplify build.
#
# All three are optional native addons with pure-JS or prebuilt fallbacks:
# Next compiles with its own @next/swc-* binaries rather than @swc/core, and
# @parcel/watcher only accelerates dev-mode file watching. Denying them keeps
# CI from compiling native code it will never load.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  unrs-resolver: false
