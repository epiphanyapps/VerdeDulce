# Marks web/ as its own pnpm root, independent of the Expo app above it.
packages:
  - "."

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  unrs-resolver: set this to true or false

# pnpm 11 reads build-script approval from here, not from package.json.
# These three ship native binaries used by Next's compiler and file watcher.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - unrs-resolver
