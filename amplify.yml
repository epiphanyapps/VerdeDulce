# Amplify Gen 2 monorepo build.
#
# The Gen 2 backend (auth / storage / analytics) stays at the repo root in
# `amplify/`; the frontend is the Next.js app in `web/`, emitted as static
# artifacts. Platform is WEB (not WEB_COMPUTE): `output: "export"` in
# web/next.config.ts produces plain HTML/CSS/JS, so there is no Next.js server
# runtime and no Amplify Next-version ceiling to track.
#
# Two redirects must be added in the Amplify console (Hosting -> Rewrites and
# redirects), because a static export has no middleware to negotiate locale:
#
#   Source: /       Target: /es/        Type: 302 (Redirect - Temporary)
#   Source: /<*>    Target: /404.html   Type: 404 (Rewrite)
#
# web/src/app/page.tsx is a client-side fallback if the first rule is missing.
#
# Package managers differ by phase on purpose: the repo root has yarn.lock
# committed (the Expo app's), while web/ has its own pnpm-lock.yaml. Each phase
# uses the manager whose lockfile is actually in git.
version: 1
applications:
  - appRoot: web
    backend:
      phases:
        build:
          commands:
            # `appRoot` starts every command in web/; the backend lives one
            # level up, alongside amplify/ and its own package.json.
            - cd ..
            - yarn install --frozen-lockfile
            - cd amplify && yarn install --frozen-lockfile && cd ..
            - yarn ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            # Installed directly rather than through corepack: the corepack
            # bundled with Amplify's Node 20 image is too old to launch pnpm 11
            # — it loads pnpm.cjs through vm with no dynamic-import callback and
            # dies with ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING before running.
            # Going via npm removes that version coupling entirely.
            - npm install -g pnpm@11.9.0
            - pnpm --version
            - pnpm install --frozen-lockfile
        build:
          commands:
            # Copies the root amplify_outputs.json (written by the backend
            # phase) into the Next module graph, then exports to web/out.
            - node scripts/sync-amplify-outputs.mjs
            - pnpm exec next build
      artifacts:
        baseDirectory: out
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*

# Next emits the generated Open Graph cards as extensionless files
# (e.g. /es/menu/tazon-de-cosecha/opengraph-image). Amplify infers Content-Type
# from the file extension, so without this they are served as
# application/octet-stream and every social scraper rejects them — no preview
# image on WhatsApp, Facebook, or Instagram.
customHeaders:
  - pattern: "**/opengraph-image"
    headers:
      - key: Content-Type
        value: image/png
      - key: Cache-Control
        value: "public, max-age=0, must-revalidate"
  - pattern: "/_next/static/**"
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"
